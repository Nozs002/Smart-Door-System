<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLock System - Access Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container dashboard-home">
    
    <!-- Status bar -->
    <div class="status-bar" style="color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3);">
      <span>09:41</span>
      <div class="status-right">
        <button class="theme-toggle" id="theme-toggle" title="Chuyển giao diện">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
        <span>●●●</span><span>LTE</span><span>78%</span>
      </div>
    </div>

    <!-- ACCESS MANAGEMENT SCREEN -->
    <div class="screen active" style="background: transparent;">
      <div class="screen-content">
        <h1 style="font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Quản lý Truy cập</h1>
        
        <!-- Tabs -->
        <div class="segment-tabs">
          <button class="segment-tab active" data-tab-target="tab-finger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 00-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0118-6"/><path d="M2 17.5A14.5 14.5 0 016 12"/><path d="M20 12a10 10 0 01-1 4.5"/><path d="M7 9.98c.12-.58.41-1.97.62-2.48"/><path d="M12 4a8 8 0 018 7.5"/><path d="M4.22 12.75a8 8 0 014.22-7"/></svg>
            Vân tay
          </button>
          <button class="segment-tab" data-tab-target="tab-rfid">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2" /><line x1="1" y1="10" x2="23" y2="10" /></svg>
            Thẻ từ
          </button>
          <button class="segment-tab" data-tab-target="tab-pin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2" /><line x1="12" y1="18" x2="12.01" y2="18" /></svg>
            PIN
          </button>
        </div>

        <!-- Fingerprint Tab -->
        <div id="tab-finger" class="tab-content active">
          <div class="flex items-center justify-between">
            <p style="font-size: 13px; color: var(--muted);">4 vân tay đã đăng ký</p>
            <button style="background: rgba(0,153,204,0.1); border: 1px solid rgba(0,153,204,0.3); color: var(--cyan); padding: 6px 12px; border-radius: 8px; cursor:pointer; font-weight:600; font-family:inherit;">+ Thêm</button>
          </div>
          <!-- Item -->
          <div class="list-item">
            <div class="icon-box cyan font-bold" style="font-family: 'JetBrains Mono', monospace;">01</div>
            <div style="flex: 1;">
              <p style="font-size: 14px; font-weight: 600;">Nguyễn Minh (Bố)</p>
              <p style="font-size: 12px; color: var(--muted);">Thêm: 12/06/2025</p>
            </div>
          </div>
          <div class="list-item">
            <div class="icon-box cyan font-bold" style="font-family: 'JetBrains Mono', monospace;">02</div>
            <div style="flex: 1;">
              <p style="font-size: 14px; font-weight: 600;">Trần Lan (Mẹ)</p>
              <p style="font-size: 12px; color: var(--muted);">Thêm: 12/06/2025</p>
            </div>
          </div>
        </div>

        <!-- RFID Tab -->
        <div id="tab-rfid" class="tab-content">
          <div class="flex items-center justify-between">
            <p style="font-size: 13px; color: var(--muted);">2 thẻ đã đăng ký</p>
            <button style="background: rgba(0,153,204,0.1); border: 1px solid rgba(0,153,204,0.3); color: var(--cyan); padding: 6px 12px; border-radius: 8px; cursor:pointer; font-weight:600; font-family:inherit;">+ Thêm</button>
          </div>
          <div class="list-item">
            <div class="icon-box amber">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2" /><line x1="1" y1="10" x2="23" y2="10" /></svg>
            </div>
            <div style="flex: 1;">
              <p style="font-size: 14px; font-weight: 600;">Thẻ chủ — Nguyễn Minh</p>
              <p style="font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace;">A3F2:B5C1</p>
            </div>
          </div>
        </div>

        <!-- PIN Tab -->
        <div id="tab-pin" class="tab-content">
          <div class="card">
            <p style="font-weight: 600; font-size: 15px; margin-bottom: 8px;">Mã PIN hiện tại</p>
            <div style="background: var(--bg); border-radius: 10px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 8px; text-align: center; border: 1px solid var(--border);">
              ● ● ● ● ● ●
            </div>
            <button class="btn-outline" style="margin-top: 16px;">Đổi mã PIN từ xa</button>
          </div>
        </div>
      </div>
    </div>

        <!-- Floating Bottom Navigation -->
    <div class="floating-nav">
      <button class="nav-icon" onclick="window.location.href='dashboard.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </button>
      <button class="nav-icon" onclick="window.location.href='door.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>
      </button>
      <button class="nav-icon" onclick="window.location.href='alerts.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></svg>
      </button>
      <button class="nav-icon" onclick="window.location.href='settings.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      </button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
