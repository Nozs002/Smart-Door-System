<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLock System - Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container dashboard-home">

    <!-- Status bar -->
    <div class="status-bar" style="color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3);">
      <span>09:41</span>
      <div class="status-right">
        <button class="theme-toggle" id="theme-toggle" title="Chuyển giao diện">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
        <span>●●●</span><span>LTE</span><span>78%</span>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div class="screen active" style="background: transparent;">
      <div class="screen-content" style="padding-top: 10px;">

        <button class="back-btn" onclick="window.location.href='index.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <div class="dash-header">
          <h1 class="dash-title" style="color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3);">Cài đặt Khóa</h1>
        </div>

        <!-- Big Card -->
        <div id="door-card" class="door-card-modern locked">
          <img src="OIP.webp" alt="Lock" class="door-img" />

          <div class="door-info">
            <div class="door-name">Cửa Chính</div>
            <div class="door-status" id="door-status">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>Đang Khóa</span>
            </div>
          </div>

          <div class="door-stats-row">
            <div class="door-stat">
              <span class="door-stat-label">Nhiệt độ</span>
              <span class="door-stat-value">27°C</span>
            </div>
            <div class="door-stat">
              <span class="door-stat-label">Độ ẩm</span>
              <span class="door-stat-value">65%</span>
            </div>
          </div>
        </div>

        <!-- Pagination dots (aesthetic) -->
        <div style="display: flex; justify-content: center; gap: 6px; margin-top: -10px; margin-bottom: 20px;">
          <div style="width: 16px; height: 4px; border-radius: 2px; background: var(--text);"></div>
          <div style="width: 4px; height: 4px; border-radius: 2px; background: var(--muted2);"></div>
          <div style="width: 4px; height: 4px; border-radius: 2px; background: var(--muted2);"></div>
        </div>

        <!-- Key Owners -->
        <div class="owners-card">
          <div>
            <div class="owners-title">Người truy cập</div>
            <div class="avatar-group">
              <img src="https://i.pravatar.cc/100?img=1" class="avatar" alt="user" />
              <img src="https://i.pravatar.cc/100?img=2" class="avatar" alt="user" />
              <img src="https://i.pravatar.cc/100?img=3" class="avatar" alt="user" />
            </div>
          </div>
          <button class="add-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Grid Cards -->
        <div class="grid-2">
          <div class="square-card" onclick="window.location.href='access.html'">
            <div class="square-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 10a2 2 0 00-2 2c0 1.02-.1 2.51-.26 4" />
                <path d="M14 13.12c0 2.38 0 6.38-1 8.88" />
                <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" />
                <path d="M2 12a10 10 0 0118-6" />
                <path d="M2 17.5A14.5 14.5 0 016 12" />
                <path d="M20 12a10 10 0 01-1 4.5" />
                <path d="M7 9.98c.12-.58.41-1.97.62-2.48" />
                <path d="M12 4a8 8 0 018 7.5" />
                <path d="M4.22 12.75a8 8 0 014.22-7" />
              </svg>
            </div>
            <div>
              <div class="square-card-title">Vân tay</div>
              <div class="square-card-subtitle">4 vân tay</div>
            </div>
          </div>

          <div class="square-card" onclick="window.location.href='access.html'">
            <div class="square-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
            </div>
            <div>
              <div class="square-card-title">Thẻ từ</div>
              <div class="square-card-subtitle">2 người dùng</div>
            </div>
          </div>

          <div class="square-card" onclick="window.location.href='access.html'">
            <div class="square-card-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <path d="M7 8h.01" /><path d="M12 8h.01" /><path d="M17 8h.01" />
                <path d="M7 12h.01" /><path d="M12 12h.01" /><path d="M17 12h.01" />
                <path d="M7 16h.01" /><path d="M12 16h.01" /><path d="M17 16h.01" />
              </svg>
            </div>
            <div>
              <div class="square-card-title">Mã PIN</div>
              <div class="square-card-subtitle">*******5</div>
            </div>
          </div>
        </div>

        <button id="unlock-btn" style="display:none;"></button>
      </div>
    </div>

    <!-- UNLOCK MODAL -->
    <div id="unlock-modal" class="modal-overlay">
      <div class="modal-content">

        <!-- Big Unlock Card -->
        <div class="unlock-card">
          <button id="close-x-btn"
            style="position: absolute; top: 20px; right: 20px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--surface2); color: var(--text); display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <div class="unlock-header">Cửa Phòng Ngủ</div>
          <img src="OIP.webp" alt="Lock" class="unlock-img" />
          <div class="unlock-status" id="modal-lock-status">Đang Khóa</div>
          <div class="unlock-sub" id="modal-lock-sub">Vuốt để mở khóa</div>

          <!-- Slider -->
          <div class="swipe-slider" id="swipe-slider">
            <div class="swipe-track">
              <span class="swipe-arrows">› › ›</span>
              <div class="swipe-icon right">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
              </div>
            </div>
            <div class="swipe-handle" id="swipe-handle">
              <svg id="handle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- More settings -->
        <button class="more-settings-btn" id="close-modal-btn">Nhiều cài đặt hơn</button>

      </div>
    </div>

    <!-- Floating Bottom Navigation -->
    <div class="floating-nav">
      <button class="nav-icon" onclick="window.location.href='dashboard.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <button class="nav-icon active" onclick="window.location.href='door.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </button>
      <button class="nav-icon" onclick="window.location.href='alerts.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
      </button>
      <button class="nav-icon" onclick="window.location.href='settings.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </button>
    </div>

  </div>
  <script src="script.js"></script>
</body>

</html>
