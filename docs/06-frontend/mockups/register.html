<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLock System - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Specific styles for the modern login screen */
    .login-glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 36px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.4);
      width: 100%;
      box-sizing: border-box;
    }
    .modern-input {
      width: 100%;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 20px;
      padding: 16px 20px;
      font-size: 15px;
      font-family: inherit;
      color: #111;
      margin-top: 8px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .modern-input:focus {
      outline: none;
      background: #fff;
      border-color: #111;
    }
    .modern-btn {
      width: 100%;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 18px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      transition: transform 0.1s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .modern-btn:active {
      transform: scale(0.97);
    }
    .modern-label {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="app-container dashboard-home">
    
    <!-- Status bar -->
    <div class="status-bar" style="color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3);">
      <span>09:41</span>
      <div class="status-right">
        <span>●●●</span><span>LTE</span><span>78%</span>
      </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="register-screen" class="screen active" style="background: transparent; display: flex; flex-direction: column; justify-content: center;">
      <div class="screen-content" style="padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 24px; padding-bottom: 32px;">
        
        <!-- Logo -->
        <div style="text-align: center; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">
          <div style="width: 72px; height: 72px; border-radius: 24px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; margin: 0 auto 16px auto; border: 1px solid rgba(255,255,255,0.4);">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0110 0v4" />
            </svg>
          </div>
          <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin: 0;">SmartLock</h1>
          <p style="font-size: 15px; opacity: 0.9; margin-top: 8px; font-weight: 500;">Hệ thống khóa thông minh</p>
        </div>
        
        <!-- Login Form Glass Card -->
        <form id="register-form" class="login-glass-card">
          <h2 style="font-size:24px;color:#111;margin-bottom:8px;">Tạo tài khoản</h2>
          <p style="font-size:13px;color:#555;margin-bottom:24px;line-height:1.5;">Đăng ký Account khách hàng để quản lý các cửa của bạn.</p>
          <div style="margin-bottom:20px;">
            <label for="display-name" class="modern-label">Tên hiển thị</label>
            <input type="text" id="display-name" class="modern-input" placeholder="Nhập tên của bạn" autocomplete="name" maxlength="100" required>
          </div>
          <div style="margin-bottom:20px;">
            <label for="register-username" class="modern-label">Tên đăng nhập</label>
            <input type="text" id="register-username" class="modern-input" placeholder="Chọn tên đăng nhập" autocomplete="username" maxlength="100" required>
          </div>
          <div style="margin-bottom:20px;">
            <label for="register-password" class="modern-label">Mật khẩu</label>
            <input type="password" id="register-password" class="modern-input" placeholder="Nhập mật khẩu" autocomplete="new-password" required>
          </div>
          <div style="margin-bottom:10px;">
            <label for="confirm-password" class="modern-label">Xác nhận mật khẩu</label>
            <input type="password" id="confirm-password" class="modern-input" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#333;margin-top:16px;cursor:pointer;">
            <input type="checkbox" id="show-register-password"> Hiện mật khẩu
          </label>
          <p id="register-status" role="status" aria-live="polite" style="font-size:13px;line-height:1.5;margin-top:16px;"></p>
          <button id="register-btn" class="modern-btn" type="submit"><span>Đăng ký</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
          <p style="text-align:center;font-size:14px;color:#333;margin-top:24px;">Đã có tài khoản? <a href="index.html" style="color:inherit;font-weight:700;text-underline-offset:4px;">Đăng nhập</a></p>
          <p style="font-size:12px;color:#555;line-height:1.5;margin-top:20px;">Bản xem thử, không tạo tài khoản thật. Không nhập mật khẩu thật. Chính sách đăng ký sẽ được chốt trước khi kết nối API.</p>
        </form>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
  <script src="register.js"></script>
</body>
</html>
