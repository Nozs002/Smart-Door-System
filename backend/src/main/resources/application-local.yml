spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_door?connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:smart_door}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    show-sql: false

app:
  jwt:
    issuer: ${JWT_ISSUER:smart-door-local}
    audience: ${JWT_AUDIENCE:smart-door-mobile}
    secret: ${JWT_SECRET:local-only-secret-change-before-use-1234567890}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  mqtt:
    host: ${MQTT_HOST:localhost}
    port: ${MQTT_PORT:1883}
    username: ${MQTT_USERNAME:smart_door}
    password: ${MQTT_PASSWORD:change_me}
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:10s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    root: INFO
    com.smartdoor.backend: DEBUG
