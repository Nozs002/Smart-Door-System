spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30s}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5s}
  jpa:
    show-sql: false

app:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  mqtt:
    host: ${MQTT_HOST}
    port: ${MQTT_PORT:8883}
    username: ${MQTT_USERNAME}
    password: ${MQTT_PASSWORD}
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:10s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.smartdoor.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
