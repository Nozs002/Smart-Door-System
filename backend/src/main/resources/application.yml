spring:
  application:
    name: smart-door-backend
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"

app:
  settings-mqtt:
    client-id: ${MQTT_CLIENT_ID:backend-settings}
    persistence-dir: ${MQTT_PERSISTENCE_DIR:.local/mqtt/backend}
    enabled: ${MQTT_SETTINGS_ENABLED:false}
    tls: ${MQTT_TLS:false}
    device-master-key: ${DEVICE_MASTER_KEY:}
    max-clock-skew-seconds: 60
    max-payload-bytes: 65536
